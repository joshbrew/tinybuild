name: native packaging
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  electron:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Linux Electron libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64
      - run: npm run test:native
      - name: Exercise the real Electron UI
        if: runner.os != 'Linux'
        run: npm run test:native:ui
      - name: Exercise the real Electron UI on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:native:ui
      - name: Exercise the Node sidecar on desktop
        if: runner.os != 'Linux'
        run: npm run test:native:sidecars
      - name: Exercise the Node sidecar on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:native:sidecars
      - name: Exercise the packaged Node sidecar
        if: runner.os != 'Linux'
        run: npm run test:native:sidecars -- --packaged
      - name: Exercise the packaged Node sidecar on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:native:sidecars -- --packaged
      - name: Exercise backend crash handling
        if: runner.os != 'Linux'
        run: npm run test:native:sidecars -- --crash
      - name: Exercise backend crash handling on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:native:sidecars -- --crash
      - uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.os }}
          path: |
            examples/native_profiles/electron/out/make/**/*.zip
            .test-native/results/
          if-no-files-found: error
          retention-days: 7

  tauri:
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: rustup update stable
      - run: rustup default stable
      - run: npm ci
      - run: npm run test:native -- --tauri
      - name: Exercise the bundled sidecar on Windows
        if: runner.os == 'Windows'
        run: npm run test:native:sidecars -- --tauri --release
      - name: Exercise bundled backend crash handling on Windows
        if: runner.os == 'Windows'
        run: npm run test:native:sidecars -- --tauri --release --crash
      - name: Install, exercise and uninstall the Windows sidecar distribution
        if: runner.os == 'Windows'
        run: npm run test:native:sidecars -- --tauri --installer
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.os }}
          path: |
            examples/native_profiles/src-tauri/target/release/tinybuild-app
            examples/native_profiles/src-tauri/target/release/tinybuild-app.exe
            .test-native/results/
          if-no-files-found: error
          retention-days: 7
